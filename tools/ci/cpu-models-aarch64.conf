# ==============================================================================
#  AcreetionOS Horizon - QEMU aarch64 CPU test matrix (ARM counterparts)
# ==============================================================================
#  One representative core per Arm generation, used by boot-test.sh when
#  boot-testing an aarch64 ISO under qemu-system-aarch64 (-M virt).
#  Format: vendor<TAB>qemu-cpu-model<TAB>bitness<optional-note>
# ==============================================================================

generic	max	64	"max" = newest featureful emulated core (bring-up smoke)
generic	cortex-a57	64	ARMv8.0 baseline (Cortex-A57)
generic	cortex-a72	64	ARMv8.0 (A72 server class)
generic	cortex-a53	64	ARMv8.0 little core (SBC class)
generic	cortex-a76	64	ARMv8.2 (Zen2-class ARM notebook cores)
generic	neoverse-n1	64	ARMv8.2 (AWS Graviton 2, server)
generic	neoverse-v1	64	ARMv8.3 (Ampere Altra class)
generic	neoverse-n2	64	ARMv8.5 (Graviton 3, qemu >= 6.2)
generic	neoverse-v2	64	ARMv9 (Graviton 4 / Ampere One class)
generic	cortex-a55	64	ARMv8.2 little core
