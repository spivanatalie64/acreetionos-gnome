# ==============================================================================
#  AcreetionOS Horizon - QEMU CPU test matrix
# ==============================================================================
#  One representative CPU model per Intel and AMD generation, used to boot-test
#  every ISO before an alpha-channel release. Format per line:
#      vendor<TAB>qemu-cpu-model<TAB>bitnesservers<optional-note>
#  Lines starting with '#' and blank lines are ignored. Models missing from
#  the installed qemu-system-x86_64 (-cpu help) are skipped with a warning.
# ==============================================================================

# ── Generic reference models ──────────────────────────────────────────────────
generic	qemu64	64	Default amd64 reference CPU
generic	qemu32	32	32-bit reference (needs an i686 kernel; x86_64 ISO reports as skip)
generic	x86_64	64	Baseline amd64 bring-up model

# ── Intel: one CPU per desktop/xeon generation ───────────────────────────────
intel	Conroe	64	Core 2 (65nm, Gen 1)
intel	Penryn	64	Core 2 / Penryn refresh (45nm, Gen 2)
intel	Nehalem	64	Core i3/i5/i7 & Xeon 5500 (Gen 3)
intel	Westmere	64	32nm Westmere + Xeon 5600 (Gen 4)
intel	SandyBridge	64	Sandy Bridge / Xeon E5 v1 (Gen 5)
intel	IvyBridge	64	Ivy Bridge / Xeon E5 v2 (Gen 6)
intel	Haswell	64	Haswell / Xeon E5 v3 (Gen 7)
intel	Broadwell	64	Broadwell / Xeon E5 v4 (Gen 8)
intel	Skylake-Client	64	Skylake desktop (Gen 9)
intel	Skylake-Server	64	Skylake-SP / Xeon Scalable Gen 1
intel	Cascadelake-Server	64	Xeon Scalable Gen 2 (10nm Cascade Lake)
intel	Cooperlake	64	Xeon Scalable Gen 3 (AVX-512 CooperLake)
intel	Icelake-Server	64	Xeon Scalable Gen 3 (Ice Lake-SP)
intel	SapphireRapids	64	Xeon Scalable Gen 4 (Sapphire Rapids, qemu >= 8.0)
intel	Snowridge	64	Snow Ridge (edge/Ice Lake-D)
intel	KnightsMill	64	Xeon Phi (KNM, AVX-512 niche)

# ── AMD: one CPU per generation ──────────────────────────────────────────────
amd	athlon	64	AMD Athlon (baseline legacy)
amd	phenom	64	AMD Phenom (Gen 1)
amd	Opteron_G1	64	Opteron Gen 1 (Gen 2)
amd	Opteron_G2	64	Opteron Gen 2 (Gen 3)
amd	Opteron_G3	64	Opteron Gen 3 / Barcelona (Gen 4)
amd	Opteron_G4	64	Opteron Gen 4 / Abu Dhabi (Gen 5)
amd	Opteron_G5	64	Opteron Gen 5 / Warsaw (Gen 6)
amd	EPYC	64	EPYC Gen 1 (Zen 1)
amd	EPYC-Rome	64	EPYC Gen 2 (Zen 2)
amd	EPYC-Milan	64	EPYC Gen 3 (Zen 3)
amd	EPYC-Genoa	64	EPYC Gen 4 (Zen 4, qemu >= 7.2)
