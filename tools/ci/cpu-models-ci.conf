# ==============================================================================
#  AcreetionOS Horizon - QEMU CI smoke-test CPU subset (GitHub Actions)
# ==============================================================================
#  Purpose: the full cpu-models.conf matrix (30 models) is too slow for CI
#  where testing runs on the TCG emulator (GitHub hosted runners never
#  expose /dev/kvm, so every boot is emulated and slow). This subset keeps
#  the matrix gate in the nightly/on-demand QA (qatest:boot-matrix on the
#  self-hosted runner, KVM-accelerated) and gives CI a fast-but-real spread.
#  Format: vendor<TAB>qemu-cpu-model<TAB>bitness<optional-note>
# ==============================================================================

generic	qemu64	64	QEMU generic baseline (fastest boot, no feature-cull)
intel	Nehalem	64	"golden" pre-SSE4.2/list old-gen compatibility probe
intel	Skylake-Client	64	meeting modern feature-set expectations (AVX et al.)
