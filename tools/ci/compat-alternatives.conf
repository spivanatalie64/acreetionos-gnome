# ==============================================================================
#  AcreetionOS Horizon - presetup alternative package list (x86_64 -> arm64)
# ==============================================================================
#  Consumed by compat-check.sh during x86_64 -> arm64 conversion checks.
#  If a package from packages.x86_64 has no equivalent in the target arch's
#  repositories, the first available alternative (comma-separated, tried in
#  order) is substituted into the target package list (--apply). An entry with
#  an empty alternative list (pkg:) marks a known x86-only carryover that is
#  safe to PRUNE from the arm64 list (--apply).
#
#  Format:  package:alternative1,alternative2,...
#  Lines starting with '#' are ignored.
#  Review entries against the current Arch Linux ARM repos whenever the
#  x86_64 list gains new hardware support packages.
# ==============================================================================

# Kernel long-term support tracks under their native arm64 name
linux-lts:linux-aarch64

# Wireless/NIC out-of-tree dkms modules ship as firmware on arm64 boards
broadcom-wl-dkms:linux-firmware
r8125-dkms:linux-firmware

# Virtualbox guest tooling is x86-only; no arm64 counterpart exists
virtualbox-guest-utils-nox:

# 32-bit companion libraries never apply to arm64 builds
lib32-nettle:
