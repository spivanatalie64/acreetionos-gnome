################################################################################
# AcreetionOS Horizon - pacman repository configuration for aarch64 (ARM builds)
#
# Alpha-tier ARM counterpart configuration. The patched XLibre/GNOME packages
# in [acreetionOSREPO] are built for x86_64 only, and the ARM pipeline skips
# them (HORIZON_SKIP_PATCHED_PACKAGES=1), using the stock Arch Linux ARM stack.
#
# SigLevel is Optional so build slots can provision without pre-trusting the
# Arch Linux ARM keyring; install archlinuxarm-keyring and populate it before
# shipping a release-grade ARM ISO.
################################################################################

[options]
Architecture = auto
ParallelDownloads = 25
SigLevel    = Optional
LocalFileSigLevel = Optional

# ── Arch Linux ARM ─────────────────────────────────────────────────────────────
[core]
Server = http://mirror.archlinuxarm.org/$arch/core

[extra]
Server = http://mirror.archlinuxarm.org/$arch/extra

[alarm]
Server = http://mirror.archlinuxarm.org/$arch/alarm

# ── AcreetionOS custom repositories (aarch64 payloads land here over time) ────
# Disabled until an aarch64 patched repository exists; keep the stanza so
# flipping it on later is a two-line change.
#[acreetionOSREPO]
#SigLevel = Optional
#Server = https://iso.acreetionos.org:8448/repo/$arch
