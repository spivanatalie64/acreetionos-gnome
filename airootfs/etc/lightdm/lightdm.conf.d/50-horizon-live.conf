# AcreetionOS Horizon live-session configuration.
# Replaces the former airootfs/etc/gdm/custom.conf (GDM -> LightDM, issue #8):
#   [daemon] WaylandEnable=false        -> LightDM is X11-only anyway
#   DefaultSession=gnome-xorg.desktop   -> user-session/autologin-session below
#   AutomaticLogin=liveuser             -> autologin-user below
# Shipped in the ISO overlay (airootfs) and therefore present in the live
# session only; the installed system is configured by Calamares' lightdm
# module (airootfs/etc/calamares/modules/displaymanager.conf), which writes
# /etc/lightdm/lightdm.conf — read after everything in lightdm.conf.d/.

[LightDM]
# X11 only desktop; LightDM itself has no Wayland mode, matching Horizon.
start-session-direct=false

[Seat:*]
# GTK greeter from the stock repositories (lightdm-gtk-greeter package).
greeter-session=lightdm-gtk-greeter
# The pinned GNOME 48 XLibre session must be the only/default one.
user-session=gnome-xorg
# Live ISO autologin as liveuser; the installer turns this off on target
# systems via lightdm.conf (see comment above).
autologin-user=liveuser
autologin-user-timeout=0
autologin-session=gnome-xorg
autologin-in-background=false
