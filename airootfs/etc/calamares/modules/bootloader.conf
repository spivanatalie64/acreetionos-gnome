# UEFI installs use systemd-boot — acreetboot (see the acreetboot project)
# builds directly on this: microboot microkernel stage via XBOOTLDR payload,
# then AcreetBootMainMenu.efi. GRUB remains for legacy BIOS installs only.
efiBootLoader: "systemd-boot"

kernel: "_ALL_kver_"
img: "_default_image_"
fallback: "_fallback_image_"
timeout: "10"
kernelParams: [ "quiet", "splash", "rw", "nvidia-drm.modeset=1", "zswap.enabled=1", "zswap.compressor=zstd", "zswap.max_pool_percent=20" ]

bootloaderEntryName: "Acreetion OS"

# GRUB keys: consulted ONLY when firmware is legacy BIOS (fw_type != "efi").
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
