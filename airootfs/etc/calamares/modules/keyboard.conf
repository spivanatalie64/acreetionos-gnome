---
# Calamares keyboard module configuration
# Automatically guess keyboard layout from selected/detected locale
guessLayout: true

# Use systemd-localed (locale1) for modern Wayland / X11 configuration
useLocale1: true

# X11 config location
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"

# Write /etc/default/keyboard
writeEtcDefaultKeyboard: true

