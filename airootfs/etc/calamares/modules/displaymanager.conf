# NOTE: gdm was removed from this list when LightDM replaced GDM (issue #8).
# On target installs Calamares writes /etc/lightdm/lightdm.conf (read last,
# after lightdm.conf.d/) with autologin disabled; the live-session autologin
# ships separately in airootfs/etc/lightdm/lightdm.conf.d/50-horizon-live.conf.
# Configure one or more display managers (e.g. SDDM)
# with a "best effort" approach.
---
#The DM module attempts to set up all the DMs found in this list, in that precise order.
#It also sets up autologin, if the feature is enabled in globalstorage.
#The displaymanagers list can also be set in globalstorage, and in that case it overrides anything set up here.
displaymanagers:
  - lightdm
  - sddm
  - slim
  - lxdm

#defaultDesktopEnvironment:
#    executable: "startxfce4"
#    desktopFile: "xfce"

#If true, try to ensure that the user, group, /var directory etc. for the
#display manager are set up correctly. This is normally done by the distribution
#packages, and best left to them. Therefore, it is disabled by default.
basicSetup: false

#If true, setup autologin for openSUSE. This only makes sense on openSUSE
#derivatives or other systems where /etc/sysconfig/displaymanager exists.
sysconfigSetup: false
