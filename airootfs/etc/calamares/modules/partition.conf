# Calamares partition module configuration
# Enhanced with NVMe support

# EFI system partition path
efiSystemPartition:     "/boot/efi"

# Device filters to detect various types of storage devices
deviceFilter:
    - "/dev/nvme[0-9]+"    # NVMe drives
    - "/dev/sd[a-z]+"      # SATA drives

# Essential mounts that shouldn't be used for installation
essentialMounts:
    - "live-*"
    - "control"
    - "ventoy"

# Swap options
userSwapChoices:
    - none      # Create no swap, use no swap
    - small     # Up to 4GB
    - suspend   # At least main memory size
    - file      # To swap file instead of partition

# Visual configuration for partition display
drawNestedPartitions:   false
alwaysShowPartitionLabels: true

# Partitioning choices
allowManualPartitioning:   true
initialPartitioningChoice: none
initialSwapChoice: none

# Disk encryption is disabled for now. GRUB cannot unlock the default LUKS2
# (Argon2id) header, and the automated layout puts /boot inside the encrypted
# container, so encrypted installs hang right after the passphrase is entered.
# This hides the "Encrypt system" checkbox on the automated partitioning pages.
# Re-enable this and the luks* modules in settings.conf once that is resolved.
enableLuksAutomatedPartitioning: false

# Filesystem settings - Rock solid ext4 only
defaultFileSystemType:  "ext4"
availableFileSystemTypes:  ["ext4"]

# Required storage for installation (in GiB)
requiredStorage:    20.0

# Explicitly enable NVMe support
enableNVMe: true

# Additional settings for improved NVMe detection
neverCreateSwapPartition: false
allowZfsEncryption: false
