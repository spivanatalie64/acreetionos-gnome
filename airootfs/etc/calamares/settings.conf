# Offline-safe base profile. The installer launcher enables online package choices.
# Configuration file for Calamares
# Syntax is YAML 1.2
---

modules-search: [ local ]

instances:
- id:       drivers
  module:   netinstall
  config:   net_drivers.conf
- id:       software
  module:   netinstall
  config:   net_software.conf
- id:       base
  module:   shellprocess
  config:   shellprocess-base.conf
- id:       first
  module:   shellprocess
  config:   shellprocess-first.conf
- id:       bootfix
  module:   shellprocess
  config:   shellprocess-bootfix.conf
- id:       nvidia-autodetect
  module:   shellprocess
  config:   shellprocess-nvidia-autodetect.conf
- id:       amd-autodetect
  module:   shellprocess
  config:   shellprocess-amd-autodetect.conf
- id:       intel-autodetect
  module:   shellprocess
  config:   shellprocess-intel-autodetect.conf
- id:       audio-fix
  module:   shellprocess
  config:   shellprocess-audio-fix.conf
- id:       zswap-zram
  module:   shellprocess
  config:   shellprocess-zswap-zram.conf
- id:       restore-data
  module:   shellprocess
  config:   shellprocess-restore-data.conf
- id:       rootfs
  module:   unpackfs
  config:   unpackfs1.conf
  weight:   50
- id:       vmlinuz
  module:   unpackfs
  config:   unpackfs2.conf
  weight:   1

sequence:
- show:
#  - windowexpander
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs@rootfs
  - unpackfs@vmlinuz
  - networkcfg
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
# Disk encryption is disabled for now (GRUB cannot unlock the default LUKS2
# Argon2id header when /boot lives inside the encrypted container, so the
# machine hangs after the passphrase is entered). Re-enable these together
# with enableLuksAutomatedPartitioning in partition.conf once that is fixed.
#  - luksbootkeyfile
#  - luksopenswaphookcfg
  - shellprocess@first
  - shellprocess@audio-fix
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - hwclock
  - services-systemd
  - shellprocess@zswap-zram
  - grubcfg
  - bootloader
  - shellprocess
  - shellprocess@bootfix
  - preservefiles
  - shellprocess@restore-data
  - umount
#  - shellprocess
- show:
  - finished

## Branding
branding: AcreetionOS

## Whether calamares should show "Are you sure?" prompt right before each execution phase.
prompt-install: true

## Whether use calamares as a post-install configuration tool rather than system installer.
dont-chroot: false

## Whether Calamares should refer itself as a "setup program" rather than an "installer".
oem-setup: false

## Disable the "Cancel" button entirely.
disable-cancel: false

## Disable the "Cancel" button once you start the 'Installation'.
disable-cancel-during-exec: false

## Hide the "Next" and "Back" button once you start the 'Installation'.
hide-back-and-next-during-exec: false

## Quit automatically after 'Installation'.
quit-at-end: false
