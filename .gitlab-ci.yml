# ═══════════════════════════════════════════════════════════════════
#  AcreetionOS ISO Build Pipeline
#  Branch: acreetionos
#
#  CONTAINER BUILD POLICY (issue #12):
#  Every variant build runs inside a Docker container, mirroring the
#  GitHub Actions workflows (.github/workflows/build-iso.yml and
#  build-iso-arm.yml), which use the same base image
#  (archlinux:base-devel / arm64v8/archlinux:base-devel).
#
#  RUNNER SETUP (run once on the build server) - docker executor:
#    gitlab-runner register \
#      --url https://gitlab.acreetionos.org \
#      --token <YOUR_RUNNER_TOKEN> \
#      --executor docker \
#      --docker-image archlinux:base-devel \
#      --docker-privileged \
#      --description "acreetionos-builder" \
#      --tag-list "acreetionos" \
#      --run-untagged false
#
#    # config.toml [runners.docker] must contain:
#    #   privileged = true
#    #   volumes = ["/var/cache/gitlab-runner:/cache", "/srv/http/iso:/srv/http/iso"]
#    # mkarchiso needs loop devices, chroot/mount and device nodes; the
#    # publish job binds the nginx-served ISO directory into the job's
#    # container. qatest:boot-matrix additionally wants /dev/kvm exposed
#    # (GPU/device passthrough happens automatically in privileged mode).
# ═══════════════════════════════════════════════════════════════════

stages:
  - prepare
  - build
  - publish

# Docker executor default for all jobs that don't override it.
default:
  image: archlinux:base-devel

variables:
  ISO_OUT_DIR:   "${CI_PROJECT_DIR}/out"
  WORK_DIR:      "${CI_PROJECT_DIR}/work"
  ISO_LABEL:     "AcreetionOS"
  PUBLISH_DIR:   "/srv/http/iso"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "acreetionos"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ───────────────────────────────────────────────────────────────────
# Shared script: container images start pristine on every job, so the
# keyring + build-deps.txt setup runs per job (the GitHub workflows do
# the same inside their containers).
# ───────────────────────────────────────────────────────────────────
.container-setup:
  script: &container-setup
    - echo "==> Initialising pacman keyring inside container..."
    - pacman-key --init
    - pacman-key --populate archlinux
    - pacman -Sy --noconfirm --needed archlinux-keyring
    - echo "==> Installing build dependencies from build-deps.txt..."
    - pacman -Sy --noconfirm --needed --config "${CI_PROJECT_DIR}/pacman.conf" $(grep -v '^\s*#\|^\s*$' "${CI_PROJECT_DIR}/build-deps.txt")
    - mkarchiso --version

# ───────────────────────────────────────────────────────────────────
# STAGE 1 – PREPARE
# Proves the docker executor + image are functional; also acts as the
# "environment ready" gate that previously ran on the shell runner.
# ───────────────────────────────────────────────────────────────────
prepare:deps:
  stage: prepare
  script: *container-setup
  rules:
    - when: always

# ───────────────────────────────────────────────────────────────────
# STAGE 2 – BUILD ISO (x86_64 variant, inside container)
# pacman.conf defines:
#   [acreetionOSREPO-main]  iso.acreetionos.org:8448/repo-main/$arch
#   [personal]              iso.acreetionos.org:8448/personal
#   [temp-repo]             iso.acreetionos.org:8448/temp_repo/
#   IgnorePkg = v4l2loopback-dkms
#   ParallelDownloads = 25
# ───────────────────────────────────────────────────────────────────
build:iso:
  stage: build
  tags:
    - acreetionos
  needs:
    - prepare:deps
  timeout: 3h
  before_script: *container-setup
  script:
    - echo "==> Starting AcreetionOS ISO build (in container)..."
    - echo "    Commit  ${CI_COMMIT_SHORT_SHA}  Branch  ${CI_COMMIT_BRANCH:-tag:$CI_COMMIT_TAG}  Runner  ${CI_RUNNER_DESCRIPTION}"
    - cd "${CI_PROJECT_DIR}"
    - echo "==> Cleaning previous build artifacts..."
    - rm -rf "${WORK_DIR}" "${ISO_OUT_DIR}"
    - mkdir -p "${ISO_OUT_DIR}"
    - mkarchiso -L "${ISO_LABEL}" -v -w "${WORK_DIR}" -o "${ISO_OUT_DIR}" -C "${CI_PROJECT_DIR}/pacman.conf" "${CI_PROJECT_DIR}"
    - echo "==> Build complete."
    - ls -lh "${ISO_OUT_DIR}"/*.iso
    - cd "${ISO_OUT_DIR}"
    - sha256sum *.iso > SHA256SUMS
    - md5sum *.iso > MD5SUMS
    - cat SHA256SUMS
  after_script:
    - rm -rf "${WORK_DIR}"
  artifacts:
    name: "AcreetionOS-${CI_COMMIT_SHORT_SHA}"
    paths:
      - out/*.iso
      - out/SHA256SUMS
      - out/MD5SUMS
    expire_in: 30 days

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 – PRE-RELEASE QA (alpha gate)
# Boot-tests the produced ISO across the CPU-generation matrix; runs in a
# privileged container (see RUNNER SETUP above) that must see the host's
# /dev/kvm for hardware-accelerated qemu. Set HORIZON_BOOT_TEST=1 (e.g. via
# the web pipeline) to include it in a run.
# ─────────────────────────────────────────────────────────────────────────────
qatest:boot-matrix:
  stage: publish
  tags:
    - acreetionos
  needs:
    - build:iso
  before_script: *container-setup
  script:
    - chmod +x tools/ci/boot-test.sh
    - ./tools/ci/boot-test.sh --iso "$(ls -1t "${ISO_OUT_DIR}"/*.iso | head -n1)"
  rules:
    - if: '$HORIZON_BOOT_TEST == "1"'
      when: on_success
    - when: never

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 5 – ARM COUNTERPART (alpha tier)
# Builds the aarch64 ISO natively inside an arm64 container on a
# docker-executor ARM64 runner tagged "acreetionos-arm" (mkarchiso cannot
# pacstrap cross-arch, so the counterpart is built natively). Patched XLibre
# packages are x86_64-only and are skipped.
# ─────────────────────────────────────────────────────────────────────────────
build:iso-arm:
  stage: build
  tags:
    - acreetionos-arm
  image: arm64v8/archlinux:base-devel
  needs: []
  timeout: 3h
  before_script:
    - echo "==> Initialising keyrings inside arm64 container..."
    - pacman-key --init
    - pacman-key --populate archlinux
    # Add the ARM mirror, pull its keyring, then trust in-package keys.
    - printf '\n[core]\nServer = http://mirror.archlinuxarm.org/\$arch/core\n' >> /etc/pacman.conf
    - pacman -Sy --noconfirm --needed archlinux-keyring
    - printf '\n[alarm]\nServer = http://mirror.archlinuxarm.org/\$arch/alarm\n' >> /etc/pacman.conf
    - pacman -Sy --noconfirm --allow-unsigned-package archlinuxarm-keyring || true
    - echo "==> Installing build dependencies from build-deps.txt..."
    - pacman -Sy --noconfirm --needed $(grep -v '^\s*#\|^\s*$' "${CI_PROJECT_DIR}/build-deps.txt")
  script:
    - echo "==> Starting AcreetionOS ISO build (aarch64 counterpart, in container)..."
    - cd "${CI_PROJECT_DIR}"
    - HORIZON_SKIP_PATCHED_PACKAGES=1 ./build.sh -H -c ./pacman-aarch64.conf || true
    # build.sh -H requires root on the runner user; run mkarchiso directly if
    # the runner is unprivileged:
    - |
      if [ ! -e "${ISO_OUT_DIR}"/*.iso ]; then
        PATH="${CI_PROJECT_DIR}:${PATH}" mkarchiso -L AcreetionOS -v -w "${WORK_DIR}-arm" -o "${ISO_OUT_DIR}" -C "${CI_PROJECT_DIR}/pacman-aarch64.conf" "${CI_PROJECT_DIR}"
      fi
    - ls -lh "${ISO_OUT_DIR}"/*.iso
  after_script:
    - rm -rf "${WORK_DIR}-arm"
  artifacts:
    name: "AcreetionOS-${CI_COMMIT_SHORT_SHA}-arm64"
    paths:
      - out/*.iso
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "acreetionos"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never

# ───────────────────────────────────────────────────────────────────
# STAGE 3 – PUBLISH
# Copies ISO to the nginx-served directory, updates latest symlink,
# keeps the 3 most recent builds and prunes the rest.
# NOTE (docker executor): /srv/http/iso must be bind-mounted into the
# job container (see RUNNER SETUP volumes above) - the publish dir lives
# on the host, not inside the pristine container image.
# ───────────────────────────────────────────────────────────────────
publish:iso:
  stage: publish
  tags:
    - acreetionos
  needs:
    - build:iso
  script:
    - ISO_FILE=$(ls "${ISO_OUT_DIR}"/*.iso | head -n1)
    - ISO_NAME=$(basename "${ISO_FILE}")
    - DATED_NAME="AcreetionOS-$(date +%Y%m%d)-${CI_COMMIT_SHORT_SHA}.iso"
    - echo "==> Publishing ${ISO_NAME} as ${DATED_NAME}"
    - mkdir -p "${PUBLISH_DIR}"
    - cp "${ISO_FILE}" "${PUBLISH_DIR}/${DATED_NAME}"
    - cp "${ISO_OUT_DIR}/SHA256SUMS" "${PUBLISH_DIR}/SHA256SUMS"
    - cp "${ISO_OUT_DIR}/MD5SUMS" "${PUBLISH_DIR}/MD5SUMS"
    - ln -sf "${PUBLISH_DIR}/${DATED_NAME}" "${PUBLISH_DIR}/AcreetionOS-latest.iso"
    - ls -t "${PUBLISH_DIR}"/AcreetionOS-2*.iso 2>/dev/null | tail -n +4 | xargs -r rm -v
    - echo "==> Done. Symlink AcreetionOS-latest.iso -> ${DATED_NAME}"
    - ls -lh "${PUBLISH_DIR}"/AcreetionOS*.iso
  environment:
    name: iso-server
    url: https://iso.acreetionos.org
  rules:
    - if: '$CI_COMMIT_BRANCH == "acreetionos"'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
