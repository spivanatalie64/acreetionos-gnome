# /etc/pacman.conf — AcreetionOS Edition
# Standard Arch Linux repositories (working). The legacy acreetionOS custom
# repo (iso.acreetionos.org:8448) is offline — commented out until restored.

[options]
IgnorePkg = v4l2loopback-dkms
NoUpgrade = pacman
OverwriteFiles = *
Architecture = auto
Overwrite    = *
Color
CheckSpace
ParallelDownloads = 25
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
# pacman 172 default is DownloadUser=alpm which breaks `pacman -Q --sysroot`
# in the airootfs (user lookup fails during pkglist generation). Root avoids it.
DownloadUser = root

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

