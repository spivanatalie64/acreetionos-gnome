# AcreetionOS Horizon live ISO boot menu
# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Horizon graphical menu. Resolve assets on the ISO rather than assuming
# the firmware-loaded GRUB prefix points at the ISO filesystem.
search --no-floppy --file --set=horizon_root %ARCHISO_SEARCH_FILENAME%
set horizon_assets="(${horizon_root})/boot/grub"
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png

if loadfont "${horizon_assets}/fonts/unicode.pf2"; then
    set gfxmode=1920x1080,1280x720,1024x768,800x600,auto
    terminal_input console
    terminal_output gfxterm
    set theme="${horizon_assets}/horizon/theme.txt"
    export theme
    background_image -m stretch "${horizon_assets}/accretiondisk.png"
fi
set color_normal=white/black
set color_highlight=black/light-cyan

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
    if [ "${grub_cpu}" == 'x86_64' ]; then
        archiso_platform="x64 ${archiso_platform}"
    elif [ "${grub_cpu}" == 'i386' ]; then
        archiso_platform="IA32 ${archiso_platform}"
    else
        archiso_platform="${grub_cpu} ${archiso_platform}"
    fi
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu} ${grub_platform}"
fi

# Set default menu entry
set default=horizon
set timeout=15
set timeout_style=menu

# Menu entries

menuentry "Start AcreetionOS Horizon (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'horizon' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n nvme_core.default_ps_max_latency_us=0 i915.force_probe=* i915.enable_guc=3 i915.enable_fbc=1 quiet splash loglevel=3 vt.global_cursor_default=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Horizon - Compatibility mode" --class arch --class gnu-linux --class gnu --class os --id 'horizon-compat' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n nvme_core.default_ps_max_latency_us=0 nomodeset i915.modeset=0 nouveau.modeset=0 vt.global_cursor_default=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Horizon - Speakup screen reader" --hotkey s --class arch --class gnu-linux --class gnu --class os --id 'horizon-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on copytoram=n nvme_core.default_ps_max_latency_us=0 i915.force_probe=* i915.enable_guc=3 i915.enable_fbc=1 quiet splash loglevel=3 vt.global_cursor_default=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Horizon - Safe graphics mode" --class arch --class gnu-linux --class gnu --class os --id 'horizon-safemode' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n nvme_core.default_ps_max_latency_us=0 nomodeset i915.modeset=0 nouveau.modeset=0 vga=normal
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Horizon - X11 diagnostic (no GDM)" --class arch --class gnu-linux --class gnu --class os --id 'horizon-diagnostic' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n horizon.diagnostic plymouth.enable=0 systemd.show_status=true loglevel=7
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    elif [ "${grub_cpu}" == "i386" -a -f '/shellia32.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellia32.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}


# GRUB init tune for accessibility
play 600 988 1 1319 4
