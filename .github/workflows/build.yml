name: Build AcreetionOS-GNOME ISO

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 180
    steps:
      - name: Install deps
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -S --noconfirm --needed archiso squashfs-tools dosfstools erofs-utils mtools xorriso libarchive grub edk2-shell git github-cli
      - uses: actions/checkout@v4
      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh 2>&1
      - name: Checksums
        run: |
          for f in ./ISO/*.iso; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: AcreetionOS-GNOME
          path: ./ISO/*.iso
          retention-days: 7
      - name: Publish Release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ISO="$(ls ./ISO/*.iso | head -1 || true)"
          if [ -z "$ISO" ]; then
            echo "no ISO to publish"
            exit 0
          fi
          TAG="build-${{ github.run_number }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" "$ISO" --repo "${{ github.repository }}"               --title "build #${{ github.run_number }}"               --notes "Automated CI build. Commit ${{ github.sha }}."
          else
            gh release upload "$TAG" "$ISO" --repo "${{ github.repository }}" --clobber
          fi
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
