name: Build AcreetionOS-GNOME ISO

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest
      options: --privileged
    timeout-minutes: 180
    steps:
      - name: Install deps
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -S --noconfirm --needed archiso squashfs-tools dosfstools erofs-utils mtools xorriso libarchive grub edk2-shell git github-cli
      - uses: actions/checkout@v4
      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh 2>&1
      - name: Checksums
        run: |
          for f in ./ISO/*.iso; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: AcreetionOS-GNOME
          path: ./ISO/*.iso
          retention-days: 7
      - name: Publish to ISO mirror
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ISO_DEPLOY_KEY }}
          EDITION: GNOME
        run: |
          set -euo pipefail
          ISO="$(ls ./ISO/*.iso | head -1 || true)"
          if [ -z "$ISO" ]; then echo "no ISO to publish"; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2400 us.iso.acreetionos.org >> ~/.ssh/known_hosts 2>/dev/null
          BASE="$(basename "$ISO" .iso)"
          DATED="${BASE}-$(date +%Y%m%d).iso"
          LATEST="AcreetionOS-${EDITION}-latest.iso"
          scp -P 2400 -i ~/.ssh/id_ed25519 "$ISO" "natalie@us.iso.acreetionos.org:/drive1/community/${DATED}"
          ssh -p 2400 -i ~/.ssh/id_ed25519 natalie@us.iso.acreetionos.org "cd /drive1/community && ln -sfn '${DATED}' '${LATEST}' && : > SUMS.body && for f in *.iso; do sha256sum \"\$f\" >> SUMS.body; done && : > SUMS.alias && for l in *-latest.iso; do t=\$(readlink \"\$l\"); (grep \" \$t\\\$\" SUMS.body || true) | sed \"s/ \$t\\\$/ \$l/\" >> SUMS.alias; done && cat SUMS.body SUMS.alias > SHA256SUMS && rm -f SUMS.body SUMS.alias"
          echo "Published ${DATED} (+ ${LATEST} alias) to iso.acreetionos.org/community/"

      - name: Publish Release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ISO="$(ls ./ISO/*.iso | head -1 || true)"
          if [ -z "$ISO" ]; then
            echo "no ISO to publish"
            exit 0
          fi
          TAG="build-${{ github.run_number }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # GitHub release assets cap at 2GiB — xz-compress if needed
            if [ "$(stat -c%s "$ISO")" -ge 2147483648 ]; then
              echo "ISO over 2GiB — compressing for release"
              xz -k -f -9 "$ISO" && ISO="$ISO.xz"
            fi
            if [ "$(stat -c%s "$ISO")" -lt 2147483648 ]; then
              gh release create "$TAG" "$ISO" --repo "${{ github.repository }}"                 --title "build #${{ github.run_number }}"                 --notes "Automated CI build. Commit ${{ github.sha }}."
            else
              echo "ISO still over 2GiB after xz -9 — skipping release asset (artifact remains in CI)"
            fi
          else
            gh release upload "$TAG" "$ISO" --repo "${{ github.repository }}" --clobber
          fi
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
