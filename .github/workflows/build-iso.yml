name: AcreetionOS Horizon ISO Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/horizon-xlibre

jobs:
  build-iso:
    name: Build AcreetionOS Horizon ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Arch keyring and package mirrors
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed archlinux-keyring

      - name: Add custom repositories
        run: |
          echo -e "\n[acreetionOSREPO]\nSigLevel = Optional\nServer = https://iso.acreetionos.org:8448/repo/\$arch" >> /etc/pacman.conf
          pacman -Sy

      - name: Install build tools and build dependencies
        run: |
          # Single source of truth shared with the container build (Dockerfile).
          mapfile -t packages < <(grep -v '^\s*#\|^\s*$' build-deps.txt)
          pacman -S --noconfirm --needed "${packages[@]}"

      - name: Build patched GNOME 48 / XLibre packages
        run: |
          chmod +x build-horizon-xlibre.sh xlibre-patches/build-patched-packages.sh build-freeman.sh
          # Build packages into local repository
          ./xlibre-patches/build-patched-packages.sh

      - name: Build Freeman utility
        run: |
          ./build-freeman.sh

      - name: Construct Horizon ISO image
        run: |
          chmod +x build.sh refresh.sh mkarchiso.sh
          HORIZON_SKIP_PATCHED_PACKAGES=1 HORIZON_REBUILD_FREEMAN=0 HORIZON_BUILD_DIR="$GITHUB_WORKSPACE/.horizon-build" ./build.sh
          ls -lh ../ISO/ || ls -lh out/

      - name: Boot smoke test (qemu x86_64 emulator, TCG)
        run: |
          chmod +x tools/ci/boot-test.sh
          # Testing policy (see issue #14): CI tests run under the x86_64
          # emulator - qemu-system-x86_64 in TCG emulation. GitHub hosted
          # runners never expose /dev/kvm, so the hypervisor is forced to
          # tcg explicitly instead of relying on auto-detect: a hosted
          # runner that ever grew /dev/kvm must not silently change what
          # this step measures. The full 30-model matrix is reserved for
          # the KVM-accelerated QA gate (qatest:boot-matrix on the
          # self-hosted runner); CI smoke-tests the small
          # tools/ci/cpu-models-ci.conf subset (~3 models) to keep the
          # emulated wall-time sane.
          ISO="$(ls -1t ../ISO/*.iso out/*.iso 2>/dev/null | head -n1)"
          ./tools/ci/boot-test.sh --arch x86_64 --iso "$ISO" \
              --hypervisors tcg --cpus tools/ci/cpu-models-ci.conf --timeout 900

      - name: Upload boot test report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AcreetionOS-Horizon-boot-test-x8664
          path: |
            ../ISO/boot-test/
            out/boot-test/
          if-no-files-found: warn
          retention-days: 14

      - name: Compute SHA-256 Checksums
        run: |
          mkdir -p final-artifacts
          cp -f ../ISO/*.iso out/*.iso final-artifacts/ 2>/dev/null || true
          cd final-artifacts
          sha256sum *.iso > SHA256SUMS
          cat SHA256SUMS

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcreetionOS-Horizon-ISO
          path: final-artifacts/
          retention-days: 14
